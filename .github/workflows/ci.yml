name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # The tests only cover pure logic, so no WSL or container engine is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            DevDbStudio.csproj
            tests/DevDbStudio.Tests/DevDbStudio.Tests.csproj

      - name: Build
        run: dotnet build DevDbStudio.csproj --configuration Release -warnaserror

      - name: Test
        run: dotnet test tests/DevDbStudio.Tests --configuration Release
